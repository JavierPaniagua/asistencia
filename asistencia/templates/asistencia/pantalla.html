<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Asistencia</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #003b7a,
                    #0056a6
                );

            min-height: 100vh;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;
        }


        /* ==========================================
           CONTENEDOR
        ========================================== */

        .contenedor {

            width: 94%;

            max-width: 1200px;

            min-height: 90vh;

            border: 5px solid #ffd700;

            border-radius: 30px;

            padding: 30px;

            text-align: center;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            position: relative;

            box-shadow:
                0 0 40px rgba(0,0,0,0.4);
        }


        /* ==========================================
           INSTITUCIÓN
        ========================================== */

        .institucion {

            position: absolute;

            top: 25px;

            width: 100%;

            padding: 0 20px;
        }

        .institucion h2 {

            color: #ffd700;

            font-size: 25px;

            margin-bottom: 5px;
        }

        .institucion p {

            font-size: 19px;

            font-weight: bold;
        }


        /* ==========================================
           TÍTULO
        ========================================== */

        .titulo {

            font-size: 45px;

            color: #ffd700;

            margin-bottom: 25px;
        }


        /* ==========================================
           ICONO
        ========================================== */

        .icono {

            font-size: 100px;

            margin-bottom: 20px;
        }


        /* ==========================================
           NOMBRE
        ========================================== */

        #nombre {

            font-size: 55px;

            font-weight: bold;

            margin-bottom: 15px;

            text-transform: uppercase;
        }


        /* ==========================================
           CURSO
        ========================================== */

        #curso {

            font-size: 35px;

            color: #ffd700;

            font-weight: bold;

            margin-bottom: 20px;
        }


        /* ==========================================
           MENSAJE
        ========================================== */

        #mensaje {

            font-size: 30px;

            margin-bottom: 25px;
        }


        /* ==========================================
           HORA DEL REGISTRO
        ========================================== */

        #hora-registro {

            font-size: 25px;

            margin-top: 10px;
        }


        /* ==========================================
           RELOJ
        ========================================== */

        #reloj {

            position: absolute;

            bottom: 55px;

            font-size: 42px;

            font-weight: bold;

            color: #ffd700;
        }


        #fecha {

            position: absolute;

            bottom: 25px;

            font-size: 20px;
        }


        /* ==========================================
           ESTADOS
        ========================================== */

        .correcto {

            color: #ffffff;
        }


        .advertencia {

            color: #ffd700;
        }


        .error {

            color: #ffdddd;
        }


        /* ==========================================
           ANIMACIÓN
        ========================================== */

        .animacion {

            animation: aparecer 0.5s ease;
        }


        @keyframes aparecer {

            from {

                opacity: 0;

                transform: scale(0.85);
            }

            to {

                opacity: 1;

                transform: scale(1);
            }
        }

    </style>

</head>


<body>


<div class="contenedor">


    <!-- INSTITUCIÓN -->

    <div class="institucion">

        <h2>
            COLEGIO NACIONAL
        </h2>

        <p>
            GRAL. JOSÉ ELIZARDO AQUINO - LUQUE
        </p>

    </div>



    <!-- CONTENIDO PRINCIPAL -->

    <div id="contenido">


        <h1 class="titulo">
            SISTEMA DE ASISTENCIA
        </h1>


        <div
            id="icono"
            class="icono"
        >
            📡
        </div>


        <div id="nombre">

            Acerque su tarjeta RFID

        </div>


        <div id="curso">

        </div>


        <div id="mensaje">

            Esperando identificación...

        </div>


        <div id="hora-registro">

        </div>


    </div>



    <!-- RELOJ -->

    <div id="reloj">

        00:00:00

    </div>


    <div id="fecha">

    </div>


</div>



<script>


// ============================================================
// VARIABLES
// ============================================================

let ultimoEvento = 0;

let temporizador = null;


// ============================================================
// RELOJ
// ============================================================

function actualizarReloj() {

    const ahora = new Date();


    const hora = ahora.toLocaleTimeString(
        "es-PY",
        {
            hour12: false
        }
    );


    const fecha = ahora.toLocaleDateString(
        "es-PY",
        {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );


    document.getElementById(
        "reloj"
    ).textContent = hora;


    document.getElementById(
        "fecha"
    ).textContent = fecha;

}


setInterval(
    actualizarReloj,
    1000
);


actualizarReloj();


// ============================================================
// PANTALLA DE ESPERA
// ============================================================

function mostrarEspera() {


    document.getElementById(
        "icono"
    ).textContent = "📡";


    document.getElementById(
        "nombre"
    ).textContent =
        "Acerque su tarjeta RFID";


    document.getElementById(
        "curso"
    ).textContent = "";


    document.getElementById(
        "mensaje"
    ).textContent =
        "Esperando identificación...";


    document.getElementById(
        "hora-registro"
    ).textContent = "";


    document.getElementById(
        "contenido"
    ).className = "animacion";
}


// ============================================================
// MOSTRAR REGISTRO
// ============================================================

function mostrarRegistro(data) {


    const icono =
        document.getElementById("icono");

    const nombre =
        document.getElementById("nombre");

    const curso =
        document.getElementById("curso");

    const mensaje =
        document.getElementById("mensaje");

    const horaRegistro =
        document.getElementById("hora-registro");



    // --------------------------------------------------------
    // REGISTRADO CORRECTAMENTE
    // --------------------------------------------------------

    if (data.estado === "registrado") {


        icono.textContent = "✅";


        nombre.textContent =
            data.nombre;


        curso.textContent =
            data.curso;


        mensaje.textContent =
            "¡BIENVENIDO! " + data.mensaje;


        mensaje.className =
            "correcto";


        horaRegistro.textContent =
            "Hora de entrada: " + data.hora;
    }


    // --------------------------------------------------------
    // YA REGISTRADO
    // --------------------------------------------------------

    else if (
        data.estado === "ya_registrado"
    ) {


        icono.textContent = "⚠️";


        nombre.textContent =
            data.nombre;


        curso.textContent =
            data.curso;


        mensaje.textContent =
            "Su asistencia ya fue registrada hoy";


        mensaje.className =
            "advertencia";


        horaRegistro.textContent =
            "Registrado a las: " + data.hora;
    }


    // --------------------------------------------------------
    // TARJETA DESCONOCIDA
    // --------------------------------------------------------

    else if (
        data.estado === "no_encontrado"
    ) {


        icono.textContent = "❌";


        nombre.textContent =
            "TARJETA NO REGISTRADA";


        curso.textContent = "";


        mensaje.textContent =
            "Comuníquese con el encargado";


        mensaje.className =
            "error";


        horaRegistro.textContent =
            "UID: " + data.uid;
    }


    document.getElementById(
        "contenido"
    ).className = "animacion";


    // --------------------------------------------------------
    // VOLVER A ESPERA DESPUÉS DE 5 SEGUNDOS
    // --------------------------------------------------------

    clearTimeout(
        temporizador
    );


    temporizador = setTimeout(
        mostrarEspera,
        5000
    );

}


// ============================================================
// CONSULTAR DJANGO
// ============================================================

async function consultarEstado() {


    try {


        const respuesta = await fetch(
            "/api/estado/",
            {
                cache: "no-store"
            }
        );


        const data =
            await respuesta.json();


        // Solo actuar ante una lectura nueva

        if (
            data.evento_id &&
            data.evento_id !== ultimoEvento
        ) {


            ultimoEvento =
                data.evento_id;


            if (
                data.estado !== "esperando"
            ) {

                mostrarRegistro(
                    data
                );
            }
        }


    } catch (error) {

        console.log(
            "Error consultando Django:",
            error
        );
    }

}


// Consultar aproximadamente dos veces por segundo

setInterval(
    consultarEstado,
    700
);


consultarEstado();


</script>


</body>

</html>
